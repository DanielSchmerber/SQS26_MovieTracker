name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./backend-test.db
      JWT_SECRET: ci-test-secret-with-enough-bytes
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: "60"
      TMDB_APIKEY: ci-test-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/sqs-movietracker/requirements.txt

      - name: Install dependencies
        working-directory: backend/sqs-movietracker
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install pytest-cov pytestarch

      - name: Run pytest with coverage
        working-directory: backend/sqs-movietracker
        env:
          PYTHONPATH: .
        run: |
          timeout 10m python -m pytest tests \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/sqs-movietracker/coverage.xml
          if-no-files-found: error

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/sqs-movietracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/sqs-movietracker/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint src

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/sqs-movietracker/coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/sqs-movietracker

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/sqs-movietracker/coverage

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  docker-images:
    name: Docker images and e2e tests
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
      - sonar

    env:
      COMPOSE_PROJECT_NAME: movietracker-e2e
      E2E_BASE_URL: https://localhost
      JWT_SECRET: ci-test-secret-with-enough-bytes
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: "60"
      DATABASE_URL: sqlite:///./e2e-test.db
      TMDB_APIKEY: ${{ secrets.TMDB_APIKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Prepare image names
        id: images
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.frontend }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/sqs-movietracker
          file: backend/sqs-movietracker/Dockerfile
          load: true
          tags: |
            sqs26-movietracker-backend:dev
            ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/sqs-movietracker
          file: frontend/sqs-movietracker/Dockerfile
          load: true
          tags: |
            sqs26-movietracker-frontend:dev
            ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Require TMDB API key
        run: |
          if [ -z "$TMDB_APIKEY" ]; then
            echo "TMDB_APIKEY repository secret is required for e2e tests."
            exit 1
          fi

      - name: Write Docker environment
        run: |
          {
            echo "TMDB_APIKEY=$TMDB_APIKEY"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_ALGORITHM=$JWT_ALGORITHM"
            echo "JWT_EXPIRY_MINUTES=$JWT_EXPIRY_MINUTES"
            echo "DATABASE_URL=$DATABASE_URL"
          } > .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Playwright test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Start Docker stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --detach --no-build

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --insecure "$E2E_BASE_URL" > /dev/null; then
              exit 0
            fi
            echo "Waiting for $E2E_BASE_URL ($attempt/60)"
            sleep 5
          done

          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color
          exit 1

      - name: Run Playwright e2e tests
        run: |
          pytest tests_e2e \
            --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results
          if-no-files-found: ignore

      - name: Collect Docker logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color > docker-compose-e2e.log

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-e2e-logs
          path: docker-compose-e2e.log
          if-no-files-found: ignore

      - name: Stop Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --volumes --remove-orphans

      - name: Push backend image
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< '${{ steps.backend-meta.outputs.tags }}'

      - name: Push frontend image
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< '${{ steps.frontend-meta.outputs.tags }}'
